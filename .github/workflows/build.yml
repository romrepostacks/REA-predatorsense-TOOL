name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Version tag to publish as a GitHub release (e.g. v0.1.0); leave empty to just build'
        required: false

permissions:
  contents: write   # needed to publish a release (v* tag push, or the release input on a manual run)

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build app/TalonForge.csproj -c Release
      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process app/bin/Release/net48/TalonForge.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: TalonForge
          path: app/bin/Release/net48/TalonForge.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: gh release create $env:TAG app/bin/Release/net48/TalonForge.exe --target ${{ github.sha }} --title "TalonForge $env:TAG" --generate-notes
